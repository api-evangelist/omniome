name: Omniome
description: Omniome was a San Diego genomics company that developed Sequencing By Binding
  (SBB) technology, a proprietary chemistry aimed at highly accurate short-read DNA sequencing.
  Surfaced as a portfolio company of dcvc, Omniome was acquired by Pacific Biosciences (PacBio)
  in 2021, and its site now redirects to pacb.com. It builds laboratory sequencing instruments
  and chemistry rather than a public developer platform, and exposes no public API surface.
